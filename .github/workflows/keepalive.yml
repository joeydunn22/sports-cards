name: Supabase keep-alive

# Free Supabase projects pause after ~7 days without activity. This pings the
# database every 3 days, then commits a timestamp so GitHub doesn't disable the
# schedule after 60 days without repo activity. deploy.yml ignores this file.

on:
  schedule:
    - cron: '17 9 */3 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          # Anonymous read: RLS returns no rows, but the request counts as activity.
          curl --fail --silent --show-error \
            -H "apikey: $SUPABASE_KEY" \
            "$SUPABASE_URL/rest/v1/cards?select=id&limit=1"

      - uses: actions/checkout@v7

      - name: Record ping
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/keepalive.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive.txt
          git commit -m "chore: Supabase keep-alive"
          git push
